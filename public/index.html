<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrintedPipes - Custom Pipe Fittings</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }

  .layout { display: flex; height: 100vh; }

  /* Sidebar */
  .sidebar { width: 340px; background: #16213e; padding: 20px; overflow-y: auto; border-right: 1px solid #0f3460; flex-shrink: 0; }
  .sidebar h1 { font-size: 22px; margin-bottom: 4px; color: #e94560; }
  .sidebar .subtitle { font-size: 12px; color: #888; margin-bottom: 20px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { flex: 1; padding: 8px 4px; text-align: center; background: #0f3460; border: none; color: #aaa; cursor: pointer; border-radius: 6px; font-size: 12px; font-weight: 600; transition: all 0.2s; min-width: 60px; }
  .tab.active { background: #e94560; color: white; }
  .tab:hover:not(.active) { background: #1a4080; }

  /* Controls */
  .control-group { margin-bottom: 16px; }
  .control-group label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: #aaa; }
  .control-group label span { color: #e94560; font-weight: 600; font-family: monospace; }
  input[type="range"] { width: 100%; height: 6px; -webkit-appearance: none; background: #0f3460; border-radius: 3px; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #e94560; cursor: pointer; }

  /* Common pipe sizes */
  .presets { margin-bottom: 16px; }
  .presets label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
  .preset-btns { display: flex; flex-wrap: wrap; gap: 4px; }
  .preset-btn { padding: 4px 10px; background: #0f3460; border: 1px solid #1a4080; color: #ccc; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .preset-btn:hover { background: #1a4080; }
  .preset-btn.active { background: #e94560; border-color: #e94560; color: white; }

  /* Download button */
  .download-btn { width: 100%; padding: 14px; background: #e94560; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
  .download-btn:hover { background: #c73652; }
  .download-btn:disabled { background: #555; cursor: wait; }

  .info { font-size: 11px; color: #666; margin-top: 12px; line-height: 1.5; }

  /* 3D viewport */
  .viewport { flex: 1; position: relative; }
  #canvas { width: 100%; height: 100%; display: block; }
  .dims { position: absolute; bottom: 16px; left: 16px; background: rgba(22, 33, 62, 0.9); padding: 8px 14px; border-radius: 6px; font-size: 12px; font-family: monospace; color: #aaa; }
</style>
</head>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Scene setup
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x1a1a2e);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
camera.position.set(80, 60, 80);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.1;

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(50, 80, 50);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0x4488ff, 0.3);
dirLight2.position.set(-30, -20, -40);
scene.add(dirLight2);

// Grid
scene.add(new THREE.GridHelper(200, 20, 0x0f3460, 0x0a1530));

// Material
const mat = new THREE.MeshPhongMaterial({
  color: 0x4488cc,
  specular: 0x222244,
  shininess: 40,
  side: THREE.DoubleSide,
});

let currentGroup = null;
let currentType = 'elbow';

function clearMesh() {
  if (currentGroup) {
    currentGroup.traverse(child => {
      if (child.isMesh) {
        child.geometry.dispose();
      }
    });
    scene.remove(currentGroup);
    currentGroup = null;
  }
}

// Elbow: single BufferGeometry built by sweeping a hollow ring cross-section
// along the full path (stub1 straight → arc → stub2 straight).
// One mesh, no separate pieces, no rotation math.
function generateElbow(pipeId, wallThick, angleDeg, bendR, stubLen) {
  const innerR = pipeId / 2;
  const outerR = innerR + wallThick;
  const angleRad = angleDeg * Math.PI / 180;
  const ringSegs = 32;
  const stubSegs = 2;
  const bendSegs = Math.max(8, Math.round(angleDeg / 2));

  // --- Build centerline path ---
  // Bend arc in XZ plane: pos = (bendR*cos(phi), 0, bendR*sin(phi))
  // At phi=0: pos=(bendR,0,0), tangent=(0,0,1)
  // Stub1 extends backward from phi=0 along -Z
  // Stub2 extends forward from phi=angle along tangent
  const pathPoints = []; // {pos, tangent}

  // Stub 1: straight from (bendR, 0, -stubLen) to (bendR, 0, 0)
  for (let i = 0; i <= stubSegs; i++) {
    const t = i / stubSegs;
    pathPoints.push({
      pos: new THREE.Vector3(bendR, 0, -stubLen * (1 - t)),
      tan: new THREE.Vector3(0, 0, 1),
    });
  }

  // Bend arc: phi=0 to phi=angle (skip phi=0, stub end already covers it)
  for (let i = 1; i <= bendSegs; i++) {
    const phi = (i / bendSegs) * angleRad;
    pathPoints.push({
      pos: new THREE.Vector3(bendR * Math.cos(phi), 0, bendR * Math.sin(phi)),
      tan: new THREE.Vector3(-Math.sin(phi), 0, Math.cos(phi)),
    });
  }

  // Stub 2: from end of bend along end tangent
  const endPhi = angleRad;
  const endPos = new THREE.Vector3(bendR * Math.cos(endPhi), 0, bendR * Math.sin(endPhi));
  const endTan = new THREE.Vector3(-Math.sin(endPhi), 0, Math.cos(endPhi));
  for (let i = 1; i <= stubSegs; i++) {
    const t = i / stubSegs;
    pathPoints.push({
      pos: endPos.clone().add(endTan.clone().multiplyScalar(stubLen * t)),
      tan: endTan.clone(),
    });
  }

  // --- Generate vertices: at each path point, place outer + inner ring ---
  const positions = [];
  const up = new THREE.Vector3(0, 1, 0);

  for (let p = 0; p < pathPoints.length; p++) {
    const { pos, tan } = pathPoints[p];
    const T = tan.clone().normalize();
    const B = new THREE.Vector3().crossVectors(T, up).normalize();
    const N = new THREE.Vector3().crossVectors(B, T).normalize();

    for (let r = 0; r < ringSegs; r++) {
      const theta = (r / ringSegs) * Math.PI * 2;
      const c = Math.cos(theta);
      const s = Math.sin(theta);

      // Outer vertex
      positions.push(
        pos.x + B.x * c * outerR + N.x * s * outerR,
        pos.y + B.y * c * outerR + N.y * s * outerR,
        pos.z + B.z * c * outerR + N.z * s * outerR,
      );
      // Inner vertex
      positions.push(
        pos.x + B.x * c * innerR + N.x * s * innerR,
        pos.y + B.y * c * innerR + N.y * s * innerR,
        pos.z + B.z * c * innerR + N.z * s * innerR,
      );
    }
  }

  const vertsPerRing = ringSegs * 2; // alternating outer, inner
  const indices = [];

  // --- Stitch adjacent rings into quads ---
  for (let p = 0; p < pathPoints.length - 1; p++) {
    for (let r = 0; r < ringSegs; r++) {
      const rn = (r + 1) % ringSegs;
      const base0 = p * vertsPerRing;
      const base1 = (p + 1) * vertsPerRing;

      // Outer surface
      const o00 = base0 + r * 2;
      const o01 = base0 + rn * 2;
      const o10 = base1 + r * 2;
      const o11 = base1 + rn * 2;
      indices.push(o00, o10, o01, o01, o10, o11);

      // Inner surface (reversed winding)
      indices.push(o00 + 1, o01 + 1, o10 + 1, o01 + 1, o11 + 1, o10 + 1);
    }
  }

  // --- End caps (annular rings connecting outer to inner) ---
  // Start cap
  for (let r = 0; r < ringSegs; r++) {
    const rn = (r + 1) % ringSegs;
    const o0 = r * 2, o1 = rn * 2, i0 = r * 2 + 1, i1 = rn * 2 + 1;
    indices.push(o0, i0, o1, o1, i0, i1);
  }
  // End cap
  const last = (pathPoints.length - 1) * vertsPerRing;
  for (let r = 0; r < ringSegs; r++) {
    const rn = (r + 1) % ringSegs;
    const o0 = last + r * 2, o1 = last + rn * 2, i0 = last + r * 2 + 1, i1 = last + rn * 2 + 1;
    indices.push(o0, o1, i0, o1, i1, i0);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  // Center it
  geo.computeBoundingBox();
  const center = new THREE.Vector3();
  geo.boundingBox.getCenter(center);
  geo.translate(-center.x, -center.y, -center.z);

  const group = new THREE.Group();
  group.add(new THREE.Mesh(geo, mat));
  return group;
}

// Generate reducer: one single LatheGeometry revolution of the full cross-section profile.
// Profile = the outline of the pipe wall in cross-section (large stub + taper + small stub).
function generateReducer(idLarge, idSmall, wallThick, transLen, stubLen) {
  const innerLarge = idLarge / 2;
  const outerLarge = innerLarge + wallThick;
  const innerSmall = idSmall / 2;
  const outerSmall = innerSmall + wallThick;
  const totalH = stubLen + transLen + stubLen;

  // Profile points (Vector2: x = distance from axis, y = height)
  // Trace the entire cross-section as a closed loop:
  // Start at bottom-outer, go up outer wall, across top, down inner wall, across bottom
  const profile = [
    // Outer wall, bottom to top
    new THREE.Vector2(outerLarge, 0),                            // bottom-outer-left
    new THREE.Vector2(outerLarge, stubLen),                      // end of large stub outer
    new THREE.Vector2(outerSmall, stubLen + transLen),           // end of transition outer
    new THREE.Vector2(outerSmall, totalH),                       // top of small stub outer
    // Top cap (ring)
    new THREE.Vector2(innerSmall, totalH),                       // top of small stub inner
    // Inner wall, top to bottom
    new THREE.Vector2(innerSmall, stubLen + transLen),           // end of transition inner
    new THREE.Vector2(innerLarge, stubLen),                      // end of large stub inner
    new THREE.Vector2(innerLarge, 0),                            // bottom-inner
    // Bottom cap (ring) - close the loop
    new THREE.Vector2(outerLarge, 0),                            // back to start
  ];

  // LatheGeometry revolves this profile 360 degrees around Y
  const geo = new THREE.LatheGeometry(profile, 64, 0, Math.PI * 2);
  const mesh = new THREE.Mesh(geo, mat);
  // Center vertically
  mesh.position.y = -totalH / 2;

  const group = new THREE.Group();
  group.add(mesh);
  return group;
}

// Generate escutcheon: single LatheGeometry of the plate cross-section profile.
function generateEscutcheon(pipeOd, plateOd, thickness, chamfer, gapTol) {
  const holeR = pipeOd / 2 + gapTol;
  const outerR = plateOd / 2;
  const cham = Math.min(chamfer, thickness - 0.1); // clamp chamfer to plate thickness

  // Profile: cross-section of the plate (traced as closed loop, revolved 360)
  const profile = [];
  if (cham > 0) {
    profile.push(
      new THREE.Vector2(outerR, 0),                          // bottom outer edge
      new THREE.Vector2(outerR, thickness - cham),           // start of chamfer
      new THREE.Vector2(outerR - cham, thickness),           // top outer edge (chamfered)
      new THREE.Vector2(holeR, thickness),                   // top inner (at hole)
      new THREE.Vector2(holeR, 0),                           // bottom inner (at hole)
      new THREE.Vector2(outerR, 0),                          // close loop
    );
  } else {
    profile.push(
      new THREE.Vector2(outerR, 0),
      new THREE.Vector2(outerR, thickness),
      new THREE.Vector2(holeR, thickness),
      new THREE.Vector2(holeR, 0),
      new THREE.Vector2(outerR, 0),
    );
  }

  const geo = new THREE.LatheGeometry(profile, 64, 0, Math.PI * 2);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = -thickness / 2;

  const group = new THREE.Group();
  group.add(mesh);
  return group;
}

// Generate coupling: LatheGeometry of cross-section with internal ridge.
function generateCoupling(pipeId, wallThick, length, ridgeWidth) {
  const innerR = pipeId / 2;
  const outerR = innerR + wallThick;
  const halfLen = length / 2;
  const halfRidge = ridgeWidth / 2;

  // Profile: outer wall up, across top, inner wall down (with ridge bump), across bottom
  const profile = [
    new THREE.Vector2(outerR, 0),
    new THREE.Vector2(outerR, length),
    new THREE.Vector2(innerR, length),
    // Inner wall top half down to ridge
    new THREE.Vector2(innerR, halfLen + halfRidge),
    // Ridge (solid ring)
    new THREE.Vector2(0.001, halfLen + halfRidge),
    new THREE.Vector2(0.001, halfLen - halfRidge),
    // Inner wall bottom half
    new THREE.Vector2(innerR, halfLen - halfRidge),
    new THREE.Vector2(innerR, 0),
    new THREE.Vector2(outerR, 0),
  ];

  const geo = new THREE.LatheGeometry(profile, 64, 0, Math.PI * 2);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = -length / 2;

  const group = new THREE.Group();
  group.add(mesh);
  return group;
}

// Generate cap: LatheGeometry of cup cross-section.
function generateCap(pipeId, wallThick, depth) {
  const innerR = pipeId / 2;
  const outerR = innerR + wallThick;
  const totalH = depth + wallThick;

  // Profile: outer wall up, across sealed top, down inner wall, across bottom opening
  const profile = [
    new THREE.Vector2(outerR, 0),
    new THREE.Vector2(outerR, totalH),
    // Sealed top
    new THREE.Vector2(0.001, totalH),
    new THREE.Vector2(0.001, depth),
    // Inner wall
    new THREE.Vector2(innerR, depth),
    new THREE.Vector2(innerR, 0),
    // Bottom opening ring
    new THREE.Vector2(outerR, 0),
  ];

  const geo = new THREE.LatheGeometry(profile, 64, 0, Math.PI * 2);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = -totalH / 2;

  const group = new THREE.Group();
  group.add(mesh);
  return group;
}

// Generate tee: BufferGeometry with hole cut in main pipe where branch connects.
function generateTee(pipeId, wallThick, branchAngleDeg, mainLen, branchLen) {
  const innerR = pipeId / 2;
  const outerR = innerR + wallThick;
  const branchAngleRad = branchAngleDeg * Math.PI / 180;
  const ringSegs = 32;
  const group = new THREE.Group();

  // Branch direction: at 90° = along +X, at 45° = 45° from Y toward X
  const branchDir = new THREE.Vector3(
    Math.sin(branchAngleRad), Math.cos(branchAngleRad), 0
  ).normalize();

  // Check if a point on the main pipe wall is inside the branch cylinder opening
  function isInsideBranch(px, py, pz) {
    const p = new THREE.Vector3(px, py, pz);
    const proj = p.dot(branchDir);
    if (proj < 0) return false; // only cut on the outward side
    const closest = branchDir.clone().multiplyScalar(proj);
    const dist = p.clone().sub(closest).length();
    return dist < innerR;
  }

  // --- Main pipe (along Y, centered) ---
  const mainSegs = 40;
  const mainPositions = [];
  const mainIndices = [];
  const vertsPerRing = ringSegs * 2;

  for (let s = 0; s <= mainSegs; s++) {
    const y = -mainLen / 2 + (s / mainSegs) * mainLen;
    for (let r = 0; r < ringSegs; r++) {
      const theta = (r / ringSegs) * Math.PI * 2;
      const c = Math.cos(theta);
      const si = Math.sin(theta);
      mainPositions.push(outerR * c, y, outerR * si);
      mainPositions.push(innerR * c, y, innerR * si);
    }
  }

  for (let s = 0; s < mainSegs; s++) {
    for (let r = 0; r < ringSegs; r++) {
      const rn = (r + 1) % ringSegs;
      const base0 = s * vertsPerRing;
      const base1 = (s + 1) * vertsPerRing;
      const o00 = base0 + r * 2;
      const o01 = base0 + rn * 2;
      const o10 = base1 + r * 2;
      const o11 = base1 + rn * 2;

      // Check quad center (outer surface) - skip if inside branch opening
      const cx = (mainPositions[o00 * 3] + mainPositions[o10 * 3] + mainPositions[o01 * 3] + mainPositions[o11 * 3]) / 4;
      const cy = (mainPositions[o00 * 3 + 1] + mainPositions[o10 * 3 + 1] + mainPositions[o01 * 3 + 1] + mainPositions[o11 * 3 + 1]) / 4;
      const cz = (mainPositions[o00 * 3 + 2] + mainPositions[o10 * 3 + 2] + mainPositions[o01 * 3 + 2] + mainPositions[o11 * 3 + 2]) / 4;

      if (isInsideBranch(cx, cy, cz)) continue;

      mainIndices.push(o00, o10, o01, o01, o10, o11);
      mainIndices.push(o00 + 1, o01 + 1, o10 + 1, o01 + 1, o11 + 1, o10 + 1);
    }
  }

  // Main pipe end caps
  for (let r = 0; r < ringSegs; r++) {
    const rn = (r + 1) % ringSegs;
    const o0 = r * 2, o1 = rn * 2, i0 = r * 2 + 1, i1 = rn * 2 + 1;
    mainIndices.push(o0, i0, o1, o1, i0, i1);
  }
  const lastMain = mainSegs * vertsPerRing;
  for (let r = 0; r < ringSegs; r++) {
    const rn = (r + 1) % ringSegs;
    const o0 = lastMain + r * 2, o1 = lastMain + rn * 2;
    const i0 = lastMain + r * 2 + 1, i1 = lastMain + rn * 2 + 1;
    mainIndices.push(o0, o1, i0, o1, i1, i0);
  }

  const mainGeo = new THREE.BufferGeometry();
  mainGeo.setAttribute('position', new THREE.Float32BufferAttribute(mainPositions, 3));
  mainGeo.setIndex(mainIndices);
  mainGeo.computeVertexNormals();
  group.add(new THREE.Mesh(mainGeo, mat));

  // --- Branch pipe (sweep along branchDir, open at base) ---
  const branchSegs = 10;
  const branchPositions = [];
  const branchIndices = [];

  // Build local frame for branch cross-section
  const T = branchDir.clone();
  const upRef = new THREE.Vector3(0, 0, 1);
  const B = new THREE.Vector3().crossVectors(T, upRef).normalize();
  const N = new THREE.Vector3().crossVectors(B, T).normalize();

  // Start slightly inside main pipe, end at branchLen + outerR from origin
  const startDist = outerR * 0.3;
  const endDist = branchLen + outerR;

  for (let s = 0; s <= branchSegs; s++) {
    const t = s / branchSegs;
    const dist = startDist + t * (endDist - startDist);
    const center = branchDir.clone().multiplyScalar(dist);

    for (let r = 0; r < ringSegs; r++) {
      const theta = (r / ringSegs) * Math.PI * 2;
      const c = Math.cos(theta);
      const si = Math.sin(theta);
      branchPositions.push(
        center.x + B.x * c * outerR + N.x * si * outerR,
        center.y + B.y * c * outerR + N.y * si * outerR,
        center.z + B.z * c * outerR + N.z * si * outerR,
      );
      branchPositions.push(
        center.x + B.x * c * innerR + N.x * si * innerR,
        center.y + B.y * c * innerR + N.y * si * innerR,
        center.z + B.z * c * innerR + N.z * si * innerR,
      );
    }
  }

  // Stitch branch rings
  for (let s = 0; s < branchSegs; s++) {
    for (let r = 0; r < ringSegs; r++) {
      const rn = (r + 1) % ringSegs;
      const base0 = s * vertsPerRing;
      const base1 = (s + 1) * vertsPerRing;
      const o00 = base0 + r * 2;
      const o01 = base0 + rn * 2;
      const o10 = base1 + r * 2;
      const o11 = base1 + rn * 2;
      branchIndices.push(o00, o10, o01, o01, o10, o11);
      branchIndices.push(o00 + 1, o01 + 1, o10 + 1, o01 + 1, o11 + 1, o10 + 1);
    }
  }

  // Only cap the tip of the branch (base stays open = the connection hole)
  const lastBranch = branchSegs * vertsPerRing;
  for (let r = 0; r < ringSegs; r++) {
    const rn = (r + 1) % ringSegs;
    const o0 = lastBranch + r * 2, o1 = lastBranch + rn * 2;
    const i0 = lastBranch + r * 2 + 1, i1 = lastBranch + rn * 2 + 1;
    branchIndices.push(o0, o1, i0, o1, i1, i0);
  }

  const branchGeo = new THREE.BufferGeometry();
  branchGeo.setAttribute('position', new THREE.Float32BufferAttribute(branchPositions, 3));
  branchGeo.setIndex(branchIndices);
  branchGeo.computeVertexNormals();
  group.add(new THREE.Mesh(branchGeo, mat));

  return group;
}

// Generate flange: plate with bolt holes + pipe stub.
function generateFlange(pipeId, wallThick, flangeOd, plateThick, stubLen, boltCount, boltDiam, boltCircle) {
  const innerR = pipeId / 2;
  const outerR = innerR + wallThick;
  const flangeR = flangeOd / 2;
  const boltR = boltDiam / 2;
  const boltCircleR = boltCircle / 2;
  const group = new THREE.Group();
  const totalH = plateThick + stubLen;
  const yOff = -totalH / 2;

  // Bolt hole centers (in XZ plane)
  const boltCenters = [];
  for (let i = 0; i < boltCount; i++) {
    const a = (i / boltCount) * Math.PI * 2;
    boltCenters.push({ x: Math.cos(a) * boltCircleR, z: Math.sin(a) * boltCircleR });
  }

  function isInBoltHole(x, z) {
    for (const b of boltCenters) {
      const dx = x - b.x, dz = z - b.z;
      if (dx * dx + dz * dz < boltR * boltR) return true;
    }
    return false;
  }

  // Build flange plate as BufferGeometry disc (annulus from innerR to flangeR)
  // with faces skipped where bolt holes are, then add top/bottom faces + outer wall + stub
  const ringSegs = 64;
  const radialSegs = 12; // rings from center to edge
  const positions = [];
  const indices = [];

  // Generate vertex grid: radialSegs+1 rings from innerR to flangeR, each with ringSegs points
  // Plus 2 Y levels (bottom=0, top=plateThick)
  for (let yi = 0; yi <= 1; yi++) {
    const y = yi * plateThick + yOff;
    for (let ri = 0; ri <= radialSegs; ri++) {
      const r = innerR + (ri / radialSegs) * (flangeR - innerR);
      for (let ai = 0; ai < ringSegs; ai++) {
        const theta = (ai / ringSegs) * Math.PI * 2;
        positions.push(r * Math.cos(theta), y, r * Math.sin(theta));
      }
    }
  }

  const ringsPerLevel = radialSegs + 1;
  const vertsPerLevel = ringsPerLevel * ringSegs;

  // Top and bottom faces (skip bolt holes)
  for (let yi = 0; yi <= 1; yi++) {
    const base = yi * vertsPerLevel;
    for (let ri = 0; ri < radialSegs; ri++) {
      for (let ai = 0; ai < ringSegs; ai++) {
        const an = (ai + 1) % ringSegs;
        const i00 = base + ri * ringSegs + ai;
        const i01 = base + ri * ringSegs + an;
        const i10 = base + (ri + 1) * ringSegs + ai;
        const i11 = base + (ri + 1) * ringSegs + an;

        // Check quad center
        const cx = (positions[i00*3] + positions[i11*3]) / 2;
        const cz = (positions[i00*3+2] + positions[i11*3+2]) / 2;
        if (isInBoltHole(cx, cz)) continue;

        if (yi === 0) {
          // Bottom face (normal -Y)
          indices.push(i00, i01, i10, i01, i11, i10);
        } else {
          // Top face (normal +Y)
          indices.push(i00, i10, i01, i01, i10, i11);
        }
      }
    }
  }

  // Outer wall of plate (connect bottom flangeR ring to top flangeR ring)
  const outerRingBot = radialSegs * ringSegs; // last ring of bottom level
  const outerRingTop = vertsPerLevel + radialSegs * ringSegs;
  for (let ai = 0; ai < ringSegs; ai++) {
    const an = (ai + 1) % ringSegs;
    const b0 = outerRingBot + ai, b1 = outerRingBot + an;
    const t0 = outerRingTop + ai, t1 = outerRingTop + an;
    indices.push(b0, t0, b1, b1, t0, t1);
  }

  // Inner wall of plate (connect bottom innerR ring to top innerR ring)
  const innerRingBot = 0;
  const innerRingTop = vertsPerLevel;
  for (let ai = 0; ai < ringSegs; ai++) {
    const an = (ai + 1) % ringSegs;
    const b0 = innerRingBot + ai, b1 = innerRingBot + an;
    const t0 = innerRingTop + ai, t1 = innerRingTop + an;
    indices.push(b0, b1, t0, b1, t1, t0);
  }

  const plateGeo = new THREE.BufferGeometry();
  plateGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  plateGeo.setIndex(indices);
  plateGeo.computeVertexNormals();
  group.add(new THREE.Mesh(plateGeo, mat));

  // Pipe stub on top (LatheGeometry, simple and clean)
  const stubProfile = [
    new THREE.Vector2(outerR, 0),
    new THREE.Vector2(outerR, stubLen),
    new THREE.Vector2(innerR, stubLen),
    new THREE.Vector2(innerR, 0),
    new THREE.Vector2(outerR, 0),
  ];
  const stubGeo = new THREE.LatheGeometry(stubProfile, 64, 0, Math.PI * 2);
  const stubMesh = new THREE.Mesh(stubGeo, mat);
  stubMesh.position.y = plateThick + yOff;
  group.add(stubMesh);

  return group;
}

// Generate offset: S-bend using sweep geometry (two opposing arcs + stubs).
function generateOffset(pipeId, wallThick, offsetDist, bendR, stubLen) {
  const innerR = pipeId / 2;
  const outerR = innerR + wallThick;
  const ringSegs = 32;

  // Calculate bend angle from offset distance and bend radius
  // offset = 2 * R * (1 - cos(A))  =>  A = acos(1 - offset/(2*R))
  const cosA = 1 - offsetDist / (2 * bendR);
  if (cosA < -1 || cosA > 1) {
    // Invalid geometry - offset too large for bend radius
    const group = new THREE.Group();
    return group;
  }
  const bendAngle = Math.acos(Math.max(-1, Math.min(1, cosA)));
  const bendSegs = Math.max(8, Math.round(bendAngle * 180 / Math.PI / 2));

  // Build path: stub1 → arc1 → arc2 (reversed) → stub2
  // Arc 1: center at origin, radius bendR, in XZ plane from (bendR, 0, 0) sweeping by bendAngle
  // Arc 2: mirrors arc1 to complete the S, shifted by offsetDist in X
  const pathPoints = [];
  const stubSegs = 2;

  // Stub 1: straight along -Z from arc1 start
  for (let i = 0; i <= stubSegs; i++) {
    const t = i / stubSegs;
    pathPoints.push({
      pos: new THREE.Vector3(bendR, 0, -stubLen * (1 - t)),
      tan: new THREE.Vector3(0, 0, 1),
    });
  }

  // Arc 1: from phi=0 to phi=bendAngle (same as elbow)
  for (let i = 1; i <= bendSegs; i++) {
    const phi = (i / bendSegs) * bendAngle;
    pathPoints.push({
      pos: new THREE.Vector3(bendR * Math.cos(phi), 0, bendR * Math.sin(phi)),
      tan: new THREE.Vector3(-Math.sin(phi), 0, Math.cos(phi)),
    });
  }

  // Arc 2: reverse bend, center shifted so it connects smoothly
  // End of arc1: pos = (bendR*cos(A), 0, bendR*sin(A)), tan = (-sin(A), 0, cos(A))
  // Arc2 center: offset from arc1 end by bendR in the -tan-perpendicular direction
  const arc1EndX = bendR * Math.cos(bendAngle);
  const arc1EndZ = bendR * Math.sin(bendAngle);
  const tanEndX = -Math.sin(bendAngle);
  const tanEndZ = Math.cos(bendAngle);
  // Normal to tangent (pointing away from arc1 center): direction from arc1center(0,0,0) to arc1end
  // Actually for S-bend, arc2 bends the opposite way
  // Arc2 center = arc1End + bendR * (direction from arc1end toward arc1center rotated 180)
  // Simpler: arc2 center is at (arc1EndX + bendR * cos(A), 0, arc1EndZ + bendR * sin(A))... no
  // Let me think: at end of arc1, tangent is (-sin(A), 0, cos(A)).
  // Arc2 curves the other way. Its center is offset from arc1End by bendR perpendicular to tangent,
  // on the OPPOSITE side from arc1's center.
  // Arc1's center is at origin. Direction from arc1End to arc1Center: -arc1End normalized.
  // Arc2's center should be on the opposite side: arc1End + bendR * (arc1End/|arc1End|)
  const arc2CenterX = arc1EndX + (arc1EndX / bendR) * bendR; // = 2*arc1EndX
  const arc2CenterZ = arc1EndZ + (arc1EndZ / bendR) * bendR; // = 2*arc1EndZ
  // Hmm that's 2*bendR*cos(A), 2*bendR*sin(A). Let me verify with offset=30, R=40, A=acos(1-30/80)=acos(0.625)=51.3°
  // arc2Center = (2*40*cos(51.3), 0, 2*40*sin(51.3)) = (50.0, 0, 62.4)
  // Arc2 sweeps from bendAngle back to 0 (going backward), centered at arc2Center
  // Arc2 at phi=0 (relative): pos = arc2Center + bendR*(-cos(A), 0, -sin(A)) = arc1End ✓

  for (let i = 1; i <= bendSegs; i++) {
    const t = i / bendSegs;
    const phi = bendAngle - t * bendAngle; // sweeps from bendAngle back to 0
    const px = arc2CenterX - bendR * Math.cos(phi);
    const pz = arc2CenterZ - bendR * Math.sin(phi);
    // pos = center - R*(cos(phi), 0, sin(phi)), phi decreasing along path
    // dp/dphi = (R*sin(phi), 0, -R*cos(phi))
    // phi decreasing => tangent = -dp/dphi = (-sin(phi), 0, cos(phi))
    const tx = -Math.sin(phi);
    const tz = Math.cos(phi);
    pathPoints.push({
      pos: new THREE.Vector3(px, 0, pz),
      tan: new THREE.Vector3(tx, 0, tz),
    });
  }

  // Stub 2: extends along tangent at end of arc2
  const lastPt = pathPoints[pathPoints.length - 1];
  const endTan = lastPt.tan.clone();
  for (let i = 1; i <= stubSegs; i++) {
    const t = i / stubSegs;
    pathPoints.push({
      pos: lastPt.pos.clone().add(endTan.clone().multiplyScalar(stubLen * t)),
      tan: endTan.clone(),
    });
  }

  // Sweep hollow ring along path (same as elbow)
  const positions = [];
  const up = new THREE.Vector3(0, 1, 0);

  for (let p = 0; p < pathPoints.length; p++) {
    const { pos, tan } = pathPoints[p];
    const T = tan.clone().normalize();
    const B = new THREE.Vector3().crossVectors(T, up).normalize();
    const N = new THREE.Vector3().crossVectors(B, T).normalize();

    for (let r = 0; r < ringSegs; r++) {
      const theta = (r / ringSegs) * Math.PI * 2;
      const c = Math.cos(theta);
      const s = Math.sin(theta);
      positions.push(
        pos.x + B.x * c * outerR + N.x * s * outerR,
        pos.y + B.y * c * outerR + N.y * s * outerR,
        pos.z + B.z * c * outerR + N.z * s * outerR,
      );
      positions.push(
        pos.x + B.x * c * innerR + N.x * s * innerR,
        pos.y + B.y * c * innerR + N.y * s * innerR,
        pos.z + B.z * c * innerR + N.z * s * innerR,
      );
    }
  }

  const vertsPerRing = ringSegs * 2;
  const indices = [];

  for (let p = 0; p < pathPoints.length - 1; p++) {
    for (let r = 0; r < ringSegs; r++) {
      const rn = (r + 1) % ringSegs;
      const base0 = p * vertsPerRing;
      const base1 = (p + 1) * vertsPerRing;
      const o00 = base0 + r * 2, o01 = base0 + rn * 2;
      const o10 = base1 + r * 2, o11 = base1 + rn * 2;
      indices.push(o00, o10, o01, o01, o10, o11);
      indices.push(o00 + 1, o01 + 1, o10 + 1, o01 + 1, o11 + 1, o10 + 1);
    }
  }

  // End caps
  for (let r = 0; r < ringSegs; r++) {
    const rn = (r + 1) % ringSegs;
    const o0 = r * 2, o1 = rn * 2, i0 = r * 2 + 1, i1 = rn * 2 + 1;
    indices.push(o0, i0, o1, o1, i0, i1);
  }
  const last = (pathPoints.length - 1) * vertsPerRing;
  for (let r = 0; r < ringSegs; r++) {
    const rn = (r + 1) % ringSegs;
    const o0 = last + r * 2, o1 = last + rn * 2, i0 = last + r * 2 + 1, i1 = last + rn * 2 + 1;
    indices.push(o0, o1, i0, o1, i1, i0);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  geo.computeBoundingBox();
  const center = new THREE.Vector3();
  geo.boundingBox.getCenter(center);
  geo.translate(-center.x, -center.y, -center.z);

  const group = new THREE.Group();
  group.add(new THREE.Mesh(geo, mat));
  return group;
}

function updatePreview() {
  clearMesh();

  try {
    if (currentType === 'elbow') {
      const pipeId = parseFloat(document.getElementById('pipe_id').value);
      const wall = parseFloat(document.getElementById('wall_thickness').value);
      const angle = parseFloat(document.getElementById('angle').value);
      const bendR = parseFloat(document.getElementById('bend_radius').value);
      const stub = parseFloat(document.getElementById('stub_length').value);
      currentGroup = generateElbow(pipeId, wall, angle, bendR, stub);

      document.getElementById('dims').textContent =
        `ID: ${pipeId.toFixed(1)}mm | OD: ${(pipeId + 2*wall).toFixed(1)}mm | Angle: ${angle}\u00B0 | Bend R: ${bendR}mm`;
    } else if (currentType === 'reducer') {
      const idL = parseFloat(document.getElementById('id_large').value);
      const idS = parseFloat(document.getElementById('id_small').value);
      const wall = parseFloat(document.getElementById('r_wall_thickness').value);
      const trans = parseFloat(document.getElementById('transition_length').value);
      const stub = parseFloat(document.getElementById('r_stub_length').value);
      currentGroup = generateReducer(idL, idS, wall, trans, stub);

      document.getElementById('dims').textContent =
        `Large: ${idL.toFixed(1)}mm \u2192 Small: ${idS.toFixed(1)}mm | Wall: ${wall}mm | Length: ${trans}mm`;
    } else if (currentType === 'escutcheon') {
      const pipeOd = parseFloat(document.getElementById('pipe_od').value);
      const plateOd = parseFloat(document.getElementById('plate_od').value);
      const thick = parseFloat(document.getElementById('e_thickness').value);
      const cham = parseFloat(document.getElementById('chamfer').value);
      const gap = parseFloat(document.getElementById('gap').value);
      currentGroup = generateEscutcheon(pipeOd, plateOd, thick, cham, gap);

      document.getElementById('dims').textContent =
        `Pipe OD: ${pipeOd.toFixed(1)}mm | Plate: ${plateOd.toFixed(0)}mm | Thick: ${thick}mm | Hole: ${(pipeOd + gap*2).toFixed(1)}mm`;
    } else if (currentType === 'coupling') {
      const pipeId = parseFloat(document.getElementById('c_pipe_id').value);
      const wall = parseFloat(document.getElementById('c_wall_thickness').value);
      const len = parseFloat(document.getElementById('c_length').value);
      const ridge = parseFloat(document.getElementById('ridge_width').value);
      currentGroup = generateCoupling(pipeId, wall, len, ridge);

      document.getElementById('dims').textContent =
        `ID: ${pipeId.toFixed(1)}mm | OD: ${(pipeId + 2*wall).toFixed(1)}mm | Length: ${len}mm | Ridge: ${ridge}mm`;
    } else if (currentType === 'cap') {
      const pipeId = parseFloat(document.getElementById('cap_pipe_id').value);
      const wall = parseFloat(document.getElementById('cap_wall_thickness').value);
      const depth = parseFloat(document.getElementById('cap_depth').value);
      currentGroup = generateCap(pipeId, wall, depth);

      document.getElementById('dims').textContent =
        `ID: ${pipeId.toFixed(1)}mm | OD: ${(pipeId + 2*wall).toFixed(1)}mm | Depth: ${depth}mm`;
    } else if (currentType === 'tee') {
      const pipeId = parseFloat(document.getElementById('t_pipe_id').value);
      const wall = parseFloat(document.getElementById('t_wall_thickness').value);
      const bAngle = parseFloat(document.getElementById('branch_angle').value);
      const mainL = parseFloat(document.getElementById('main_length').value);
      const branchL = parseFloat(document.getElementById('branch_length').value);
      currentGroup = generateTee(pipeId, wall, bAngle, mainL, branchL);

      document.getElementById('dims').textContent =
        `ID: ${pipeId.toFixed(1)}mm | OD: ${(pipeId + 2*wall).toFixed(1)}mm | Branch: ${bAngle}\u00B0 | Main: ${mainL}mm`;
    } else if (currentType === 'flange') {
      const pipeId = parseFloat(document.getElementById('f_pipe_id').value);
      const wall = parseFloat(document.getElementById('f_wall_thickness').value);
      const fOd = parseFloat(document.getElementById('flange_od').value);
      const pThick = parseFloat(document.getElementById('plate_thickness').value);
      const stub = parseFloat(document.getElementById('f_stub_length').value);
      const bCount = parseInt(document.getElementById('bolt_count').value);
      const bDiam = parseFloat(document.getElementById('bolt_diameter').value);
      const bCircle = parseFloat(document.getElementById('bolt_circle').value);
      currentGroup = generateFlange(pipeId, wall, fOd, pThick, stub, bCount, bDiam, bCircle);

      document.getElementById('dims').textContent =
        `Pipe ID: ${pipeId.toFixed(1)}mm | Flange: ${fOd}mm | ${bCount}x \u00D8${bDiam}mm bolts`;
    } else if (currentType === 'offset') {
      const pipeId = parseFloat(document.getElementById('o_pipe_id').value);
      const wall = parseFloat(document.getElementById('o_wall_thickness').value);
      const offDist = parseFloat(document.getElementById('offset_distance').value);
      const bendR = parseFloat(document.getElementById('o_bend_radius').value);
      const stub = parseFloat(document.getElementById('o_stub_length').value);
      currentGroup = generateOffset(pipeId, wall, offDist, bendR, stub);

      document.getElementById('dims').textContent =
        `ID: ${pipeId.toFixed(1)}mm | Offset: ${offDist}mm | Bend R: ${bendR}mm`;
    }

    scene.add(currentGroup);
  } catch(e) {
    console.error('Preview error:', e);
  }
}

// Resize handling
function resize() {
  const vp = document.querySelector('.viewport');
  const w = vp.clientWidth;
  const h = vp.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// Expose to global scope
window.switchType = function(type) {
  currentType = type;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
  ['elbow', 'reducer', 'escutcheon', 'coupling', 'cap', 'tee', 'flange', 'offset'].forEach(t => {
    const el = document.getElementById(t + '-controls');
    if (el) el.style.display = type === t ? 'block' : 'none';
  });
  updatePreview();
};

window.updateParam = function(el) {
  const val = parseFloat(el.value);
  const suffix = (el.id === 'angle' || el.id === 'branch_angle') ? '\u00B0' : el.id === 'bolt_count' ? '' : 'mm';
  const label = document.getElementById('v-' + el.id);
  if (label) label.textContent = val + suffix;
  updatePreview();
};

window.setPreset = function(diameter) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
  const sliderMap = {
    elbow: 'pipe_id',
    reducer: 'id_large',
    coupling: 'c_pipe_id',
    cap: 'cap_pipe_id',
    tee: 't_pipe_id',
    flange: 'f_pipe_id',
    offset: 'o_pipe_id',
  };
  if (currentType === 'escutcheon') {
    const slider = document.getElementById('pipe_od');
    slider.value = diameter + 3;
    window.updateParam(slider);
  } else if (sliderMap[currentType]) {
    const slider = document.getElementById(sliderMap[currentType]);
    slider.value = diameter;
    window.updateParam(slider);
  }
};

window.downloadSTL = async function() {
  const btn = document.querySelector('.download-btn');
  btn.disabled = true;
  btn.textContent = 'Generating STL...';

  let params;
  if (currentType === 'elbow') {
    params = {
      pipe_id: document.getElementById('pipe_id').value,
      wall_thickness: document.getElementById('wall_thickness').value,
      angle: document.getElementById('angle').value,
      bend_radius: document.getElementById('bend_radius').value,
      stub_length: document.getElementById('stub_length').value,
    };
  } else if (currentType === 'reducer') {
    params = {
      id_large: document.getElementById('id_large').value,
      id_small: document.getElementById('id_small').value,
      wall_thickness: document.getElementById('r_wall_thickness').value,
      transition_length: document.getElementById('transition_length').value,
      stub_length: document.getElementById('r_stub_length').value,
    };
  } else if (currentType === 'escutcheon') {
    params = {
      pipe_od: document.getElementById('pipe_od').value,
      plate_od: document.getElementById('plate_od').value,
      thickness: document.getElementById('e_thickness').value,
      chamfer: document.getElementById('chamfer').value,
      gap: document.getElementById('gap').value,
    };
  } else if (currentType === 'coupling') {
    params = {
      pipe_id: document.getElementById('c_pipe_id').value,
      wall_thickness: document.getElementById('c_wall_thickness').value,
      length: document.getElementById('c_length').value,
      ridge_width: document.getElementById('ridge_width').value,
    };
  } else if (currentType === 'cap') {
    params = {
      pipe_id: document.getElementById('cap_pipe_id').value,
      wall_thickness: document.getElementById('cap_wall_thickness').value,
      depth: document.getElementById('cap_depth').value,
    };
  } else if (currentType === 'tee') {
    params = {
      pipe_id: document.getElementById('t_pipe_id').value,
      wall_thickness: document.getElementById('t_wall_thickness').value,
      branch_angle: document.getElementById('branch_angle').value,
      main_length: document.getElementById('main_length').value,
      branch_length: document.getElementById('branch_length').value,
    };
  } else if (currentType === 'flange') {
    params = {
      pipe_id: document.getElementById('f_pipe_id').value,
      wall_thickness: document.getElementById('f_wall_thickness').value,
      flange_od: document.getElementById('flange_od').value,
      plate_thickness: document.getElementById('plate_thickness').value,
      stub_length: document.getElementById('f_stub_length').value,
      bolt_count: document.getElementById('bolt_count').value,
      bolt_diameter: document.getElementById('bolt_diameter').value,
      bolt_circle: document.getElementById('bolt_circle').value,
    };
  } else if (currentType === 'offset') {
    params = {
      pipe_id: document.getElementById('o_pipe_id').value,
      wall_thickness: document.getElementById('o_wall_thickness').value,
      offset_distance: document.getElementById('offset_distance').value,
      bend_radius: document.getElementById('o_bend_radius').value,
      stub_length: document.getElementById('o_stub_length').value,
    };
  }

  try {
    const resp = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: currentType, params }),
    });

    if (!resp.ok) {
      const err = await resp.json();
      alert('Error: ' + (err.error || 'Generation failed'));
      return;
    }

    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentType + '_custom.stl';
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Download STL';
  }
};

// Init
resize();
updatePreview();
animate();

console.log('PrintedPipes frontend loaded');
</script>
